services:
  db:
    image: postgres:16
    container_name: threatshield_db
    environment:
      POSTGRES_USER: khawla
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: threatshield_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khawla -d threatshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: threatshield_backend
    env_file:
      - ./backend/.env.docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"

  frontend:
    build: ./frontend
    container_name: threatshield_frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:

